name: auto 18:00

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 18:00 WIB = 11:00 UTC Senin-Jumat
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance openpyxl pandas
      - run: python fetch-bei.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@shandy.com"
          git add saham.xlsx
          if git diff --staged --quiet; then
            echo "TIDAK ADA PERUBAHAN - harga sama"
            exit 0
          else
            echo "ADA PERUBAHAN - update commit"
            git commit -m "auto 18:00 update $(date +'%Y-%m-%d %H:%M WIB')"
            git push
          fi
